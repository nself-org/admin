name: Hygiene

# Consolidates trivial, sub-minute checks that previously ran as separate
# workflows (each claiming its own runner allocation on every push/PR):
#   - clean-root.yml             (root hygiene / tracked junk / secrets)
#   - clean-working-tree.yml     (duplicate subset of clean-root.yml — removed)
#   - nself-first-check.yml      (docker-compose header gate)
#   - doc-sync.yml               (Doc-Sync Ritual, P93 Theme 27)
#   - generated-file-gate.yml    (blocks committed `# GENERATED BY` files)
#   - price-lint.yml             (canonical pricing string check)
#   - sec-lint.yml                (TypeScript security lint script)
#   - price-drift-check.yml      (superseded price string / bundle-price check)
#   - release-tag-drift-check.yml (package.json version <-> git tag drift, push/schedule only)
# Sharing one checkout + one runner cuts 8 queued runner allocations per push
# down to 1. None of these steps are required branch-protection checks
# (Test Summary, in e2e-tests.yml, is untouched).
#
# version-lockstep.yml is intentionally NOT folded in here: it runs on
# push/PR to *every* branch (`branches: ['**']`), not just main. Folding it
# in would force this workflow's trigger to widen to all branches too,
# increasing runs everywhere else instead of cutting them — so it stays a
# separate, narrowly-scoped workflow (concurrency added independently).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Preserves release-tag-drift-check.yml's daily safety net: catches
    # version/tag drift even when no push triggers this workflow (e.g. the
    # tagging step of a release was skipped, cancelled, or reverted).
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── clean-root.yml ────────────────────────────────────────────────
      - name: Forbid markdown at repo root other than README.md
        run: |
          OFFENDERS=$(find . -maxdepth 1 -name '*.md' ! -name 'README.md' -type f | sort)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Disallowed markdown files at repo root:"
            echo "$OFFENDERS"
            echo ""
            echo "Per the nSelf Sub-Repo Root Hygiene rule:"
            echo "  - CONTRIBUTING.md  -> .github/wiki/Contributing.md  (or .github/docs/contributing.md)"
            echo "  - CODE_OF_CONDUCT.md -> .github/wiki/Code-of-Conduct.md"
            echo "  - CHANGELOG.md     -> .github/wiki/Changelog.md"
            echo "  - SECURITY.md      -> .github/SECURITY.md"
            echo "  - other .md        -> .github/wiki/ (or .github/docs/ for private repos)"
            echo ""
            echo "Spec: ~/.claude/CLAUDE.md (Clean Repo Root - Hard Rule)"
            echo "      ~/Sites/nself/.claude/CLAUDE.md (Sub-Repo Root Hygiene - Hard Rule)"
            exit 1
          fi
          echo "Repo root markdown is clean (only README.md present)."

      - name: Forbid tracked .DS_Store / OS junk anywhere in tree
        run: |
          OFFENDERS=$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|\.swp$|\.swo$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Tracked OS / editor junk in repository:"
            echo "$OFFENDERS"
            echo ""
            echo "Run: git rm --cached <file> for each, then commit. Add to .gitignore."
            echo "Spec: ~/.claude/CLAUDE.md (Clean Working Tree - Hard Rule)"
            exit 1
          fi
          echo "No tracked OS junk."

      - name: Forbid tracked secret-bearing .env files
        run: |
          # Per nSelf env cascade convention (PPI):
          #   ALLOWED tracked: .env.dev, .env.staging, .env.prod, .env.production,
          #                    .env.example, .env.template, .env.sample,
          #                    (.environments|environments)/<env>/.env  (web-specific variant)
          #   FORBIDDEN tracked: .env (bare, anywhere not under .environments/<env>/),
          #                      .env.local, .env.secrets, .env.computed
          OFFENDERS=$(git ls-files \
            | grep -E '(^|/)(\.env|\.env\.local|\.env\.secrets|\.env\.computed)$' \
            | grep -vE '(^|/)(\.environments|environments)/[^/]+/\.env$' \
            || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Tracked SECRET-BEARING .env file(s) found:"
            echo "$OFFENDERS"
            echo ""
            echo "Per the nSelf env cascade convention, .env / .env.local / .env.secrets / .env.computed"
            echo "must NEVER be tracked. They contain local overrides or production secrets."
            echo "(Exception: .environments/<env>/.env is allowed — web-specific config-folder pattern.)"
            echo ""
            echo "If credentials are in any tracked file: ROTATE THEM and scrub git history."
            echo "Spec: ~/.claude/CLAUDE.md (Clean Working Tree) + ~/Sites/nself/.claude/CLAUDE.md (Env cascade)"
            exit 1
          fi
          echo "No tracked secret-bearing .env files."

      - name: Verify .gitignore baseline patterns present
        run: |
          REQUIRED=(.DS_Store .env node_modules)
          MISSING=()
          for pattern in "${REQUIRED[@]}"; do
            if ! grep -qE "(^|/)${pattern//./\\.}(\$|/)" .gitignore 2>/dev/null && ! grep -qE "^${pattern//./\\.}\$" .gitignore 2>/dev/null; then
              MISSING+=("$pattern")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::.gitignore missing baseline patterns: ${MISSING[*]}"
            echo "See ~/.claude/CLAUDE.md (Clean Working Tree - Hard Rule) for full baseline."
          fi

      # ── nself-first-check.yml ────────────────────────────────────────
      - name: nSelf-First — verify docker-compose headers
        if: github.event_name == 'pull_request'
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- '**/docker-compose*.yml' '**/docker-compose*.yaml' || true)

          if [ -z "$FILES" ]; then
            echo "No compose files changed — OK."
            exit 0
          fi

          FAIL=0
          for f in $FILES; do
            # task/ is the D6 any-stack exception — whitelisted globally.
            case "$f" in
              ntask/backend/*) echo "SKIP (D6 ntask/ exception): $f"; continue ;;
              *docker-compose.plugin.yml) echo "SKIP (plugin-fragment): $f"; continue ;;
            esac

            head -5 "$f" | grep -qE '^# (GENERATED BY nself build|NSELF-FIRST EXCEPTION:|DEPRECATED — side-channel compose)' && {
              echo "OK: $f"
              continue
            }

            echo "FAIL: $f is missing an approved nSelf-First header."
            echo "  Required header (one of):"
            echo "    # GENERATED BY nself build — DO NOT HAND EDIT"
            echo "    # NSELF-FIRST EXCEPTION: <plugin-fragment|d6-any-stack|b-type-distribution|cli-internal-template>"
            echo "    # DEPRECATED — side-channel compose, removal tracked in nself-first-cli-gaps.md"
            echo "  See doctrine: ~/Sites/nself/.claude/docs/doctrines/nself-first.md"
            FAIL=1
          done
          exit $FAIL

      # ── doc-sync.yml ─────────────────────────────────────────────────
      - name: Doc-Sync — compute PR diff
        if: github.event_name == 'pull_request'
        id: doc_sync_diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || true)
          {
            echo "changed<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$changed"

      - name: Doc-Sync Ritual — matrix check
        if: github.event_name == 'pull_request'
        env:
          CHANGED: ${{ steps.doc_sync_diff.outputs.changed }}
        run: |
          set -u
          missing=0
          rows=""

          matches() {
            echo "$CHANGED" | grep -qE "$1"
          }

          # Commands / flags
          if matches '^cli/(cmd|internal/commands)/'; then
            if ! matches '^(cli/\.wiki/commands/|\.claude/docs/sport/F02-COMMAND-INVENTORY\.md|\.claude/docs/reference/cli-commands\.md|web/docs/content/cli/)'; then
              rows="${rows}- commands/flags changed without cli/.wiki/commands/ or F02-COMMAND-INVENTORY.md update\n"
              missing=1
            fi
          fi

          # Env vars
          if matches '(^|/)\.env\.example$|^cli/internal/env/'; then
            if ! matches '(\.claude/docs/sport/F09-ENV-VAR-INVENTORY\.md|cli/\.wiki/reference/env-vars\.md|web/docs/content/reference/env-vars|\.github/wiki/reference/env-vars\.md)'; then
              rows="${rows}- env vars changed without F09-ENV-VAR-INVENTORY.md or env-vars reference update\n"
              missing=1
            fi
          fi

          # API endpoints
          if matches '^web/backend/services/|^web/backend/.*/metadata/'; then
            if ! matches '(web/docs/content/api/|\.claude/docs/API-Reference\.md|\.claude/docs/sport/F08-SERVICE-INVENTORY\.md)'; then
              rows="${rows}- API endpoints changed without web/docs/content/api/ or F08-SERVICE-INVENTORY.md update\n"
              missing=1
            fi
          fi

          # UI pages
          if matches '^(admin/app/|web/[^/]+/src/app/)'; then
            if ! matches '(admin/\.wiki/|web/docs/content/|\.github/docs/|\.github/wiki/)'; then
              rows="${rows}- UI pages changed without matching .wiki/ or web/docs/content/ update\n"
              missing=1
            fi
          fi

          # Pricing / tiers
          if matches '^(web/org/content/(pricing|membership)/|web/org/src/.*(pricing|tier)|plugins-pro/.*/tier)'; then
            if ! matches '(\.claude/docs/sport/F07-PRICING-TIERS\.md|\.claude/docs/membership/|web/org/content/(pricing|membership)/)'; then
              rows="${rows}- pricing/tiers changed without F07-PRICING-TIERS.md or membership docs update\n"
              missing=1
            fi
          fi

          # Plugins / bundles
          if matches '^(plugins|plugins-pro)/[^/]+/'; then
            if ! matches '(\.claude/docs/sport/F0[346]-|plugins/README\.md|plugins-pro/README\.md|web/org/content/plugins/|web/docs/content/plugins/)'; then
              rows="${rows}- plugins/bundles changed without F03/F04/F06 or README or web/*/content/plugins/ update\n"
              missing=1
            fi
          fi

          # Ports / subdomains
          if echo "$CHANGED" | grep -vE '^\.github/ci/' | grep -qE '^(nginx/|.*docker-compose\.ya?ml$)'; then
            if ! matches '(\.claude/docs/sport/F10-PORT-REGISTRY\.md|\.claude/docs/sport/F11-SUBDOMAIN-MAP\.md|\.claude/CLAUDE\.md)'; then
              rows="${rows}- ports/subdomains changed without F10-PORT-REGISTRY.md or F11-SUBDOMAIN-MAP.md update\n"
              missing=1
            fi
          fi

          # Versions
          if matches '(^cli/VERSION$|pubspec\.yaml$|homebrew-nself/.*\.rb$|plugins-pro/VERSION$|^Cargo\.toml$)'; then
            if ! matches '(\.claude/docs/MASTER-VERSIONS\.md|\.claude/docs/sport/F01-MASTER-VERSIONS\.md|web/org/content/changelog|homebrew-nself/Formula/)'; then
              rows="${rows}- version files changed without MASTER-VERSIONS.md or F01 update\n"
              missing=1
            fi
          fi

          if [ "$missing" -eq 1 ]; then
            echo "::error::Doc-Sync Ritual violations detected"
            printf '%b' "$rows"
            echo ""
            echo "Doctrine: .claude/docs/doctrines/doc-sync-ritual.md"
            echo "Matrix:   .claude/qa/pre-commit.md"
            exit 1
          fi

          echo "Doc-Sync Ritual: all surface changes have matching doc updates."

      # ── generated-file-gate.yml ──────────────────────────────────────
      - name: Generated File Gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="HEAD~1"
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n 5 "$f" | grep -q "# GENERATED BY"; then
              if git check-ignore -q "$f"; then
                echo "OK: $f is generated but gitignored."
              else
                echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
                echo "  -> $f"
                FAIL=1
              fi
            fi
          done <<< "$CHANGED"

          if [ "$FAIL" -eq 1 ]; then
            echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
            exit 1
          fi

          echo "Generated File Gate: clean."

      # ── price-lint.yml ───────────────────────────────────────────────
      - name: Verify canonical prices in source
        run: |
          set -e
          echo "Verifying bundle prices match canon (\$0.99/mo bundles, \$3.99/mo ɳSelf+, \$39.99/yr ɳSelf+)..."
          # Disallowed old prices
          if grep -rIE 'class="?price"?|"price":|\$1\.99|\$19\.99|\$49\.99/yr-only' --include='*.tsx' --include='*.ts' --include='*.dart' --include='*.md' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=build \
               --exclude=CHANGELOG.md --exclude=Changelog.md . 2>/dev/null; then
            echo "ERROR: stale price reference found. Canon: \$0.99/mo bundle · \$3.99/mo or \$39.99/yr ɳSelf+"
            exit 1
          fi
          echo "OK"

      # ── sec-lint.yml ─────────────────────────────────────────────────
      - name: Run security lint
        run: bash scripts/sec-lint.sh src

      # ── price-drift-check.yml ────────────────────────────────────────
      - name: Check for superseded price strings
        run: |
          set -e

          # Superseded price strings that must NOT appear in source
          BANNED_PRICES=(
            '\$1\.99/mo'
            '\$19\.99/yr'
            '\$4\.99/mo'
            '\$49\.99/yr'
            '\$9\.99/mo'
            '\$99\.99/yr'
            'ClawDE\+'
            '\bnMedia\b'
          )

          FAIL=0
          for pattern in "${BANNED_PRICES[@]}"; do
            matches=$(grep -rn --include='*.tsx' --include='*.ts' \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
              -E "$pattern" src/ || true)
            if [ -n "$matches" ]; then
              echo "FAIL: found superseded string matching '$pattern':"
              echo "$matches"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Canonical prices per SPORT F07 (2026-04-22):"
            echo "  All bundles:  \$0.99/mo  /  \$9.99/yr"
            echo "  ɳSelf+:       \$3.99/mo  /  \$39.99/yr"
            exit 1
          fi

          echo "OK: no superseded price strings found."

      - name: Verify canonical bundle prices present
        run: |
          set -e
          python3 - <<'EOF'
          import subprocess, sys, re

          # Check that the bundle price map has all bundles at $0.99/mo
          src = open('src/app/plugins/marketplace/page.tsx').read()

          # Extract bundlePrice object
          m = re.search(r'const bundlePrice.*?=\s*\{(.*?)\}', src, re.DOTALL)
          if not m:
              print('WARN: could not find bundlePrice object')
              sys.exit(0)

          block = m.group(1)
          bundles = re.findall(r"(\w+):\s*'(\$[\d.]+/\w+)'", block)

          errors = []
          for name, price in bundles:
              if price != '$0.99/mo':
                  errors.append(f"  {name}: {price!r} (expected '$0.99/mo')")

          if errors:
              print('FAIL: non-canonical bundle prices in marketplace/page.tsx:')
              for e in errors:
                  print(e)
              sys.exit(1)

          print(f'OK: all {len(bundles)} bundle prices are $0.99/mo.')
          EOF

      # ── release-tag-drift-check.yml (push/schedule/dispatch only) ────
      - name: Read package.json version
        if: github.event_name != 'pull_request'
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package.json version: ${VERSION}"

      - name: Assert release tag exists and points at HEAD's release lineage
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="v${VERSION}"

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag drift: package.json is at ${VERSION} but tag ${TAG} does not exist."
            echo "::error::The release/docker-publish workflows trigger ONLY on 'push: tags: v*' —"
            echo "::error::without this tag, v${VERSION} was never built or published to Docker Hub."
            echo "::error::Fix: git tag ${TAG} <release-commit-sha> && git push origin ${TAG}"
            exit 1
          fi

          TAG_SHA=$(git rev-parse "refs/tags/${TAG}")
          if ! git merge-base --is-ancestor "${TAG_SHA}" HEAD; then
            echo "::error::Release tag drift: ${TAG} exists but does not point to a commit on this branch's history."
            echo "::error::package.json says ${VERSION} but the tagged commit (${TAG_SHA}) is not an ancestor of HEAD."
            exit 1
          fi

          echo "OK: ${TAG} exists and is part of main's history — package.json/tag are in sync."
