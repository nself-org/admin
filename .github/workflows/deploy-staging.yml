name: Deploy Staging

on:
  push:
    branches: [main]

env:
  DOCKER_IMAGE: nself/nself-admin
  DOCKER_TAG_STAGING: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        id: docker-login
        # ACCEPTED: Docker Hub credentials may not be set in all environments (see next step for graceful skip).
        # Expiry: permanent — fallback pattern is intentional for environments without push credentials.
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check Docker credentials
        if: steps.docker-login.outcome != 'success'
        run: |
          echo "::warning::Docker Hub credentials not configured. Staging deployment skipped."
          echo "To enable staging deployments, add DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,"
          echo "STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_URL secrets."

      - name: Extract metadata
        if: steps.docker-login.outcome == 'success'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ env.DOCKER_TAG_STAGING }}
            type=sha,prefix=${{ env.DOCKER_TAG_STAGING }}-

      - name: Resolve CLI version for Dockerfile
        id: cli_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Dockerfile's ARG NSELF_VERSION default tracks the in-development
          # version (admin is version-locked to the CLI), so between a version
          # bump and that version's CLI release there is no tarball to download
          # and the build dies on a bare `curl 404`. docker-publish.yml already
          # resolves this; this build did not, so it broke on every bump.
          ADMIN_VER="$(node -p "require('./package.json').version")"
          # Test for the ASSET, not merely the release. nself-org/cli also hosts
          # @nself/sdk releases, which carry the same tag and zero CLI binaries,
          # so "the release exists" is not the same as "the tarball exists".
          # v1.2.7 was exactly that: a real release with no assets.
          has_tarball() {
            gh release view "v$1" --repo nself-org/cli --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -q "^nself-$1-linux-amd64.tar.gz$"
          }
          ADMIN_VER="$(node -p "require('./package.json').version")"
          if has_tarball "$ADMIN_VER"; then
            CLI_VER="$ADMIN_VER"
            echo "CLI v${CLI_VER} publishes a linux-amd64 tarball; using it."
          else
            CLI_VER="$(gh release list --repo nself-org/cli --limit 30 --json tagName --jq '.[].tagName' \
              | sed 's/^v//' | while read -r v; do has_tarball "$v" && { echo "$v"; break; }; done)"
            echo "CLI v${ADMIN_VER} has no tarball — using newest release that does: ${CLI_VER}"
          fi
          if [ -z "$CLI_VER" ]; then
            echo "::error::No nself-org/cli release publishes a linux-amd64 tarball"; exit 1
          fi
          echo "cli_version=$CLI_VER" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: steps.docker-login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: NSELF_VERSION=${{ steps.cli_version.outputs.cli_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Check staging host availability
        id: staging-check
        if: steps.docker-login.outcome == 'success'
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::STAGING_HOST not configured. SSH deploy skipped."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to staging server
        if: steps.docker-login.outcome == 'success' && steps.staging-check.outputs.available == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG_STAGING }}
            docker stop nself-admin-staging || true
            docker rm nself-admin-staging || true
            docker run -d \
              --name nself-admin-staging \
              --restart unless-stopped \
              -p 3021:3021 \
              -v /var/nself/staging:/workspace:rw \
              -v nself-admin-data-staging:/app/data \
              -e NODE_ENV=staging \
              -e NSELF_PROJECT_PATH=/workspace \
              ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG_STAGING }}

      - name: Wait for service to be ready
        if: steps.docker-login.outcome == 'success' && steps.staging-check.outputs.available == 'true'
        run: |
          echo "Waiting for staging service to be ready..."
          sleep 10

      - name: Run smoke tests
        if: steps.docker-login.outcome == 'success' && steps.staging-check.outputs.available == 'true'
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"

          # Health check with retry (3x)
          for i in 1 2 3; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health" || echo "000")
            if [ "$response" = "200" ]; then
              echo "Health check passed"
              break
            fi
            echo "Health check attempt $i failed with status $response"
            if [ "$i" = "3" ]; then
              echo "::error::Health check failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          # Version check
          version=$(curl -s "${STAGING_URL}/api/nself/version" | jq -r '.version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Version check failed"
            exit 1
          fi
          echo "Version: $version"

      - name: Notify deployment
        if: steps.docker-login.outcome == 'success' && steps.staging-check.outputs.available == 'true' && always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
