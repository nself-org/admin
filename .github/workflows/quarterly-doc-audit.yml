name: Quarterly doc audit

on:
  # 08:00 UTC on day 1 of every 3rd month: Jan, Apr, Jul, Oct.
  schedule:
    - cron: '0 8 1 */3 *'
  workflow_dispatch:
    inputs:
      apply_autofix:
        description: 'Apply safe auto-fixes and open a PR'
        required: false
        # Opt-in, NOT the default. The autofix rewrites prose via the released
        # `nself audit docs --fix`, which deleted banned adjectives at word level and
        # produced broken English/Markdown in public wikis (nself-org/plugins#34 and
        # #36, both closed unmerged, 48 files each). Root cause fixed in
        # nself-org/cli#216, but this workflow downloads the latest RELEASE, so the old
        # behaviour ships until a CLI release includes that fix. Scheduled runs pass no
        # inputs, so the condition below is `== 'true'` (strict opt-in) rather than
        # `!= 'false'`, which would have let the quarterly cron rewrite docs unattended.
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Disable git-lfs filters
        # Binaries under this repo's `filter=lfs` .gitattributes patterns (png/jpg/...)
        # were committed as raw content, never migrated to real LFS pointers. With the
        # lfs smudge/clean filter active, git recomputes each file's "clean" pointer
        # form and diffs it against the real binary blob actually committed, so these
        # files show as perpetually modified — "Encountered N files that should have
        # been pointers, but weren't". That trips peter-evans/create-pull-request's
        # internal `git stash push`/`stash pop` dance in the next step ("local changes
        # would be overwritten by merge"), unrelated to any real doc-audit change.
        #
        # Two prior attempts here didn't work: `git lfs uninstall --local` was a no-op
        # (the filter is registered at GLOBAL scope on this runner, not local — PR #70),
        # and unsetting it at --global scope worked but mutates config outside this
        # checkout (unsafe on shared/persistent runners — PR #71 draft). `.git/info/
        # attributes` has higher precedence than any in-tree .gitattributes and is
        # local to this one checkout only: `* -filter` unconditionally clears the
        # filter attribute for every path here, so git always compares raw content,
        # without touching git config at any scope. Verified locally that this
        # actually neutralizes an active clean/smudge filter for status/diff purposes.
        run: echo '* -filter' >> .git/info/attributes

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Determine quarter label
        id: quarter
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          Q=$(( (10#$MONTH - 1) / 3 + 1 ))
          echo "label=${YEAR}-Q${Q}" >> "$GITHUB_OUTPUT"

      - name: Install nself audit tool
        run: |
          # Build the audit tool from the cli repo (sibling checkout).
          # If the current repo is the CLI itself, build from ./cmd/nself.
          # Otherwise, fetch the pinned release.
          if [ -f ./cmd/nself/main.go ]; then
            go build -mod=vendor -o /usr/local/bin/nself ./cmd/nself/
          else
            # Grab the latest nself CLI release from the tap.
            LATEST=$(curl -fsSL https://api.github.com/repos/nself-org/cli/releases/latest \
              | grep tag_name | head -1 | cut -d'"' -f4 | sed 's/^v//')
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
            if curl -fsSL "https://github.com/nself-org/cli/releases/download/v${LATEST}/nself-${LATEST}-${OS}-${ARCH}.tar.gz" \
              | tar -xz -C /tmp --strip-components=1; then
              # release tarballs nest a nself-<ver>-<os>-<arch>/ dir — strip it.
              # Install to a user-writable path instead of /usr/local/bin: avoids
              # depending on passwordless sudo, which self-hosted runners correctly
              # don't grant by default (see nself-org/web#93).
              mkdir -p "$HOME/.local/bin"
              mv /tmp/nself "$HOME/.local/bin/nself"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            else
              echo "::warning::nself release download/extract failed — audit tool unavailable, skipping"
            fi
          fi
          export PATH="$HOME/.local/bin:$PATH"
          nself --version || true

      - name: Run doc audit
        id: audit
        run: |
          mkdir -p .claude/qa/findings
          REPORT=".claude/qa/findings/${{ steps.quarter.outputs.label }}-doc-audit.json"
          set +e
          nself audit docs \
            --root "${GITHUB_WORKSPACE}" \
            --output "${REPORT}" \
            --summary \
            --quarter "${{ steps.quarter.outputs.label }}"
          EXIT=$?
          set -e
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "exit=${EXIT}" >> "$GITHUB_OUTPUT"
          # Exit codes: 0 clean, 1 findings (expected), 2 scan failed.
          if [ "${EXIT}" -eq 2 ]; then
            exit 2
          fi

      - name: Apply auto-fixes (banned words only)
        id: fix
        if: ${{ github.event.inputs.apply_autofix == 'true' }}
        run: |
          set +e
          nself audit docs \
            --root "${GITHUB_WORKSPACE}" \
            --output "${{ steps.audit.outputs.report }}" \
            --quarter "${{ steps.quarter.outputs.label }}" \
            --fix
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # The audit run leaves unrelated files modified in the working tree —
      # observed: public/icon.png, public/favicon-*.png, public/apple-touch-icon.png,
      # public/android-chrome-*.png, src/images/nself.png. Those are NOT in
      # add-paths, so create-pull-request stashes them, switches branch, and the
      # subsequent `git stash pop` dies with
      #   "error: Your local changes to the following files would be overwritten by merge"
      # failing the whole workflow even though the audit itself succeeded.
      # Discard everything outside the doc paths we actually intend to commit,
      # so the tree is clean apart from the auto-fixes.
      - name: Discard non-doc changes before opening PR
        if: ${{ github.event.inputs.apply_autofix == 'true' }}
        run: |
          set -euo pipefail
          echo "Working tree before cleanup:"
          git status --porcelain | head -20
          # restore every modified/untracked path that is not a doc artefact
          git checkout -- . \
            ':(exclude)*.md' ':(exclude)*.mdx' ':(exclude).claude/qa/findings/*.json' 2>/dev/null || true
          git clean -fd -e '*.md' -e '*.mdx' -e '.claude/qa/findings' 2>/dev/null || true
          echo "Working tree after cleanup:"
          git status --porcelain | head -20

      - name: Open auto-fix PR
        if: ${{ github.event.inputs.apply_autofix == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'docs(audit): quarterly sweep ${{ steps.quarter.outputs.label }}'
          title: 'Quarterly doc audit — ${{ steps.quarter.outputs.label }}'
          body-path: ${{ steps.audit.outputs.report }}
          branch: audit/quarterly-${{ steps.quarter.outputs.label }}
          delete-branch: true
          add-paths: |
            **/*.md
            **/*.mdx

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: doc-audit-${{ steps.quarter.outputs.label }}
          path: .claude/qa/findings/${{ steps.quarter.outputs.label }}-doc-audit.json
          retention-days: 180
